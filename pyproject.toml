[project]
name = "swvnv"
version = "0.1.0"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pymupdf>=1.27.2.3",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
